<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citadel Character Index</title>
  <meta name="description" content="A polished Rick and Morty character index.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>

  <header class="hero">
    <nav class="nav">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div>
          <strong>Citadel</strong>
          <span>Character Index</span>
        </div>
      </div>
      <div class="nav-pill"><span class="live-dot"></span> Live database</div>
    </nav>

    <div class="hero-content">
      <div class="eyebrow">DIMENSIONAL DATABASE</div>
      <h1>Citadel <span>Character Index</span></h1>
      <p>Explore characters, dimensions, species, and statuses across the multiverse.</p>

      <div class="controls">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="searchInput" type="search" placeholder="Search characters..." autocomplete="off">
          <kbd>/</kbd>
        </label>

        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="alive">Alive</option>
          <option value="dead">Dead</option>
          <option value="unknown">Unknown</option>
        </select>

        <select id="speciesFilter" aria-label="Filter by species">
          <option value="">All species</option>
          <option value="Human">Human</option>
          <option value="Alien">Alien</option>
          <option value="Robot">Robot</option>
          <option value="Humanoid">Humanoid</option>
        </select>

        <select id="pageSize" aria-label="Characters per page">
          <option value="12">12 per page</option>
          <option value="20" selected>20 per page</option>
          <option value="40">40 per page</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <section class="stats" aria-label="Database statistics">
      <div><span class="stat-label">RESULTS</span><strong id="resultCount">—</strong></div>
      <div><span class="stat-label">PAGE</span><strong id="pageCount">—</strong></div>
      <div><span class="stat-label">SOURCE</span><strong>Rick & Morty API</strong></div>
      <div class="status-legend">
        <span><i class="dot alive"></i> Alive</span>
        <span><i class="dot dead"></i> Dead</span>
        <span><i class="dot unknown"></i> Unknown</span>
      </div>
    </section>

    <div id="error" class="error" hidden></div>
    <section id="grid" class="grid" aria-live="polite"></section>

    <div class="pagination">
      <button id="prevBtn" class="page-btn" disabled>← Previous</button>
      <div id="pageNumbers" class="page-numbers"></div>
      <button id="nextBtn" class="page-btn">Next →</button>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <article class="modal-card">
      <button id="closeModal" class="close" aria-label="Close">×</button>
      <img id="modalImage" alt="">
      <div class="modal-info">
        <div id="modalStatus" class="badge"></div>
        <h2 id="modalName"></h2>
        <div class="detail-grid">
          <div><span>Species</span><strong id="modalSpecies"></strong></div>
          <div><span>Gender</span><strong id="modalGender"></strong></div>
          <div><span>Origin</span><strong id="modalOrigin"></strong></div>
          <div><span>Location</span><strong id="modalLocation"></strong></div>
        </div>
      </div>
    </article>
  </div>

  <footer>
    <span>Citadel Index</span>
    <span>Built for the multiverse • v2.0</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
